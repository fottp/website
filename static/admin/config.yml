backend:
  name: github
  repo: fottp/website
  branch: main

# Each save becomes a draft pull request and "Publish" merges it, so editors
# never push straight to main. Together with .github/CODEOWNERS and the branch
# ruleset described in docs/HANDOFF.md ("Access and review") this means only
# content changes can go live without an owner's review.
publish_mode: editorial_workflow

# Sign in with a GitHub personal access token (Sveltia CMS's "Sign In
# with Token" button) — no OAuth app or proxy server needed. Fine for
# a small committee; see docs/HANDOFF.md for how to generate one.

media_folder: static/images
public_folder: /images

# Photos are shrunk and converted when they are added, so editors don't have to resize them first
# and a 5 MB phone photo or PNG never lands in Git. Anything bigger than 1600px on its longest side
# is scaled down to fit (the shape is kept; smaller photos are never enlarged) and saved as WebP at
# quality 82 (WebP is the only output format Sveltia offers). The file ends up named <name>.webp.
# This also lets iPhone (HEIC) photos be uploaded. Caveat: an animated GIF would become a still image.
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600
          height: 1600

collections:
  - name: pages
    label: Pages
    files:
      - name: home
        label: Home
        file: content/_index.md
        media_folder: ""
        public_folder: ""
        fields:
          - {label: Title, name: title, widget: string}
          - {label: Content, name: body, widget: markdown}

      - name: about-us
        label: About Us
        file: content/about-us/index.md
        media_folder: ""
        public_folder: ""
        fields:
          - {label: Title, name: title, widget: string}
          - {label: Content, name: body, widget: markdown}

      - name: our-partners
        label: Our Partners
        file: content/our-partners/index.md
        media_folder: ""
        public_folder: ""
        fields:
          - {label: Title, name: title, widget: string}
          - {label: Content, name: body, widget: markdown}

      - name: our-projects
        label: Our Projects
        file: content/our-projects/index.md
        media_folder: ""
        public_folder: ""
        fields:
          - {label: Title, name: title, widget: string}
          - {label: Content, name: body, widget: markdown}

      - name: contact-us
        label: Contact Us
        file: content/contact-us/index.md
        media_folder: ""
        public_folder: ""
        fields:
          - {label: Title, name: title, widget: string}
          - label: Content
            name: body
            widget: markdown
            hint: "The contact form itself is managed by the site's developer and isn't editable here — this is just the page text above it."

      - name: become-a-member
        label: Become a Member
        file: content/become-a-member/index.md
        media_folder: ""
        public_folder: ""
        fields:
          - {label: Title, name: title, widget: string}
          - label: Content
            name: body
            widget: markdown
            hint: "The membership form itself is managed by the site's developer and isn't editable here — this is just the page text above it."

  - name: news
    label: News
    label_singular: News post
    folder: content/news
    path: "{{slug}}/index"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: md
    format: yaml-frontmatter
    create: true
    media_folder: ""
    public_folder: ""
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "D MMMM YYYY", time_format: false, hint: "Shown on the post. A future date hides the post until that day."}
      - {label: Summary, name: description, widget: text, required: false, hint: "One or two sentences shown on the News page and the home page. If left blank, the start of the post is used."}
      - {label: Photo, name: image, widget: image, required: false, choose_url: false, hint: "Optional. Shown small next to the post on the News page and home page, and large at the top of the post."}
      - {label: Photo description, name: image_alt, widget: string, required: false, hint: "Describe what the photo shows, for people using screen readers. Only needed if you add a photo."}
      - {label: Content, name: body, widget: markdown}

  # Events. One folder per event, like news. Past events move to "Past events" by themselves
  # (the site is rebuilt every night), so there is never any need to delete them.
  - name: events
    label: Events
    label_singular: Event
    folder: content/events
    path: "{{slug}}/index"
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    create: true
    media_folder: ""
    public_folder: ""
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Starts, name: start, widget: datetime, format: "YYYY-MM-DD HH:mm", date_format: "D MMMM YYYY", time_format: "HH:mm", hint: "Date and time the event starts. For an event that repeats every week, this is the FIRST session."}
      - {label: Ends, name: end, widget: datetime, format: "YYYY-MM-DD HH:mm", date_format: "D MMMM YYYY", time_format: "HH:mm", required: false, hint: "Date and time it finishes. Leave blank if there is no set finish time. For an event that repeats every week, this is the end of the FIRST session (the same day as 'Starts')."}
      - label: Repeats
        name: repeats
        widget: select
        required: false
        options:
          - {label: "Every week, on the same day and time as the first session", value: weekly}
        hint: "Leave empty for a one-off event."
      - {label: Last session on or before, name: until, widget: datetime, format: "YYYY-MM-DD", date_format: "D MMMM YYYY", time_format: false, required: false, hint: "Only for events that repeat. Leave blank if it carries on until you say otherwise."}
      - label: Weeks with no session
        name: skip_dates
        widget: list
        required: false
        field: {label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "D MMMM YYYY", time_format: false}
        hint: "Only for events that repeat: add the date of any session that is NOT happening, such as a bank holiday. It disappears from the list and from people's calendars."
      - {label: Where, name: location, widget: string, required: false, hint: "For example 'Sensory Garden, Telford Town Park'. If left blank the event is shown as at 'Telford Town Park'."}
      - {label: Cost, name: cost, widget: string, required: false, hint: "For example 'Free' or '£3 per person'. Leave blank to show nothing."}
      - {label: Summary, name: description, widget: text, required: false, hint: "One or two sentences shown on the Events page and the home page. If left blank, the start of the text below is used."}
      - {label: Photo, name: image, widget: image, required: false, choose_url: false, hint: "Optional. Shown small beside the event on the Events page, and large at the top of the event's own page."}
      - {label: Photo description, name: image_alt, widget: string, required: false, hint: "Describe what the photo shows, for people using screen readers. Only needed if you add a photo."}
      - {label: Booking or information link, name: link_url, widget: string, required: false, hint: "Optional web address, starting https://. Shows as a button on the event's page."}
      - {label: Link button text, name: link_label, widget: string, required: false, hint: "Wording for that button, such as 'Book a place'. Blank shows 'Find out more'."}
      - {label: Content, name: body, widget: markdown}

  # Archive of newsletters, reports and so on. One folder per document holding its details and the PDF;
  # the Archive page (layouts/archive/) lists them, newest first, and links straight to each PDF.
  - name: archive
    label: Archive
    label_singular: Archive document
    folder: content/archive
    path: "{{slug}}/index"
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    create: true
    media_folder: ""
    public_folder: ""
    fields:
      - {label: Title, name: title, widget: string, hint: "As it should appear in the list, for example 'Explore, Autumn 2026'."}
      - label: Kind of document
        name: category
        widget: select
        options:
          - {label: "Explore newsletter", value: newsletters}
          - {label: "Chairman's report", value: reports}
          - {label: "Minutes or agenda", value: minutes}
          - {label: "Programme, leaflet or plan", value: leaflets}
        hint: "Decides which list it appears in."
      - {label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "D MMMM YYYY", time_format: false, hint: "Only used to put the list in order (newest first); it isn't shown. Use the date it came out, or the first day of its season."}
      - {label: PDF file, name: file, widget: file, accept: ".pdf,application/pdf", hint: "The document itself. Drag it onto this box. Please remove any private email addresses or phone numbers of individuals first."}
      - {label: Number of pages, name: pages, widget: number, value_type: int, min: 1, required: false, hint: "Optional. Shown beside the title."}

  # Photo galleries. One folder per collection holding its photos; the Gallery page shows a card for each, and
  # each collection page is a grid that opens PhotoSwipe (a full-screen viewer) when a photo is chosen.
  - name: gallery
    label: Gallery
    label_singular: Photo collection
    folder: content/gallery
    path: "{{slug}}/index"
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    create: true
    media_folder: ""
    public_folder: ""
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Summary, name: description, widget: text, required: false, hint: "One or two sentences, shown under the title on the Gallery page and at the top of the collection."}
      - {label: Order on the Gallery page, name: weight, widget: number, value_type: int, required: false, hint: "Collections are listed lowest number first (10, 20, 30, and so on)."}
      - label: Thumbnail shape
        name: thumbs
        widget: select
        required: false
        options:
          - {label: "Square (the default)", value: square}
          - {label: "Landscape (3:2), better when the photos are landscape", value: landscape}
        hint: "The small pictures on this collection's page. Enlarged photos always show whole."
      - {label: Cover photo, name: cover, widget: image, required: false, choose_url: false, hint: "The picture on this collection's card. Leave empty to use its first photo."}
      - label: Photos
        name: photos
        widget: list
        label_singular: Photo
        summary: "{{fields.caption}} ({{fields.image}})"
        thumbnail: image
        hint: "In the order they appear. Drag a photo onto the Photo box (they are shrunk automatically). Please only add photos that people have agreed to have shown, and no photos of children unless the parent or carer has agreed."
        fields:
          - {label: Photo, name: image, widget: image, choose_url: false}
          - {label: Description for screen readers (alt text), name: alt, widget: string, required: false, hint: "What the photo shows, in one sentence, for people who can't see it. Leave blank if you're not sure: it will say 'Photo 3 of 40'."}
          - {label: Caption, name: caption, widget: string, required: false, hint: "Optional. Shown under the photo when it is enlarged."}
      - {label: Introduction, name: body, widget: markdown, required: false, hint: "Optional. Extra text shown above the photos."}
