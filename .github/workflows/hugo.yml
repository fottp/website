name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
    # A push that only touches these files changes nothing on the site, so it needn't rebuild it.
    # (A push that also touches anything else still builds.)
    paths-ignore:
      - 'docs/**'
      - 'CLAUDE.md'
  # Rebuild every night just after midnight (UK time) so that events which have passed move to
  # "Past events", weekly sessions roll on to the next date, and future-dated news appears on its day.
  # GitHub pauses scheduled runs after 60 days with no activity on a public repo; any push restarts them.
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'
          extended: true
      - uses: actions/configure-pages@v5
      - run: hugo --minify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
